name: Build Linux (YOLO AutoInstaller 2.0)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 \
            libxcb-xkb1 libxkbcommon-x11-0 libnss3 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyyaml requests pyinstaller

      - name: Build Linux binary
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed \
            --name YOLO_AutoInstaller_2.0 \
            --clean \
            --add-data "repos.yaml:." \
            --add-data "modules:modules" \
            --add-data "assets:assets" \
            main.py
          chmod +x dist/YOLO_AutoInstaller_2.0

      - name: Upload binary to v2.0 Release
        run: |
          gh release upload v2.0 --clobber dist/YOLO_AutoInstaller_2.0 \
            --repo alansong49/yolov-one-click-installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer script to v2.0 Release
        run: |
          cp "Linux一键安装.sh" linux-installer.sh
          gh release upload v2.0 --clobber linux-installer.sh \
            --repo alansong49/yolov-one-click-installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "### 构建产物" >> $GITHUB_STEP_SUMMARY
          ls -lh dist/
          echo "已上传到 Release v2.0" >> $GITHUB_STEP_SUMMARY
